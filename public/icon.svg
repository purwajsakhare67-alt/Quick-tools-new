<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#starGlow)" opacity="0.6" />

  <!-- Central Card with Gradient Rim -->
  <rect x="86" y="86" width="340" height="340" rx="90" fill="url(#badgeGrad)" filter="url(#dropShadow)" />
  <rect x="94" y="94" width="324" height="324" rx="82" fill="#0b0f19" />

  <!-- Sparkle Primary 4-Point Star -->
  <path d="M 256 130 Q 256 256 382 256 Q 256 256 256 382 Q 256 256 130 256 Q 256 256 256 130 Z" fill="#38bdf8" />
  <!-- Inner White Spark Core -->
  <path d="M 256 170 Q 256 256 342 256 Q 256 256 256 342 Q 256 256 170 256 Q 256 256 256 170 Z" fill="#ffffff" />

  <!-- Secondary Gold Star Accent -->
  <path d="M 360 120 Q 360 155 395 155 Q 360 155 360 190 Q 360 155 325 155 Q 360 155 360 120 Z" fill="#fbbf24" />
</svg>
